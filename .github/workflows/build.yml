name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK (targetSdk 29)
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          export D8_JAR="$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar"
          export APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          export ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          export KEYSTORE="$RUNNER_TEMP/ci.jks"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass android \
            -keypass android -alias ci -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI,O=CardClone,C=CN"
          ./build.sh

      - name: Build AAB (targetSdk 35)
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          curl -sSL -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar
          export BUNDLETOOL="$PWD/bundletool.jar"
          TARGET_SDK=35 ./tools/build_bundle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: card-clone
          path: |
            build/nfc-tool.apk
            build-bundle/app*.aab
